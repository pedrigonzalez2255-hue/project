<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#cfe8fb;--ink:#1d3557;--rose:#2f6fb0;--soft:#2c5d94;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#cfe8fb;--ink:#1d3557;--rose:#2f6fb0}}
:root[data-theme="dark"]{--bg:#cfe8fb;--ink:#1d3557;--rose:#2f6fb0}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{min-height:100vh;background:linear-gradient(180deg,#a9d6f7 0%,#e4f3ff 100%);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;display:flex;flex-direction:column;align-items:center;gap:26px;padding:56px 24px 72px;text-align:center;animation:in 1.4s ease both}
@keyframes in{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){body{animation:none}}
.photo{width:min(320px,82vw);aspect-ratio:1.05;border:0;padding:4px;cursor:pointer;background:var(--rose);display:block;clip-path:url(#heart)}
.photo span{display:flex;width:100%;height:100%;align-items:center;justify-content:center;clip-path:url(#heart);background:#d9edff;color:var(--rose);font-size:1.05rem;padding:30px 50px;line-height:1.3}
.photo img{width:100%;height:100%;object-fit:cover;clip-path:url(#heart);display:block}
h1{font-size:clamp(2.4rem,9vw,3.8rem);font-weight:500;font-style:italic;outline:none;min-width:4ch}
h1:empty::before{content:attr(data-ph);color:var(--rose);opacity:.7}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button.pill{background:none;color:var(--ink);border:1px solid var(--rose);border-radius:999px;padding:10px 26px;font:inherit;font-size:1.1rem;cursor:pointer}
button.pill:hover,button.pill:focus-visible{background:var(--rose);color:var(--bg)}
button.pill.quiet{border-color:transparent;color:var(--rose);padding:10px 14px}
:focus-visible{outline:2px solid var(--soft);outline-offset:3px}
.letter{max-width:36ch;font-size:1.25rem;line-height:1.75;margin-top:14px}
.letter p+p{margin-top:1.1em}
.sign{font-style:italic;color:var(--soft)}
.hint{font-size:.95rem;color:var(--rose);opacity:.8}
.caret{display:inline-block;width:1px;height:1em;background:var(--soft);margin-left:2px;vertical-align:-.12em;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
body>:not(.deco):not(svg):not(script){position:relative;z-index:1}
.cloud{position:absolute;left:-220px;background:#fff;border-radius:999px;opacity:.8;filter:blur(1.5px);animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:170px;height:46px;top:10%;animation-duration:85s}
.c1::before{width:74px;height:74px;top:-32px;left:26px}.c1::after{width:54px;height:54px;top:-22px;left:90px}
.c2{width:130px;height:36px;top:38%;animation-duration:120s;animation-delay:-50s}
.c2::before{width:58px;height:58px;top:-26px;left:20px}.c2::after{width:42px;height:42px;top:-16px;left:68px}
.c3{width:150px;height:40px;top:68%;animation-duration:100s;animation-delay:-20s}
.c3::before{width:64px;height:64px;top:-28px;left:22px}.c3::after{width:46px;height:46px;top:-18px;left:78px}
@keyframes drift{to{transform:translateX(calc(100vw + 460px))}}
.fl{position:absolute;bottom:-30px;color:#6fa8dd;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.6}100%{transform:translateY(-112vh) translateX(24px);opacity:0}}
.orn{color:var(--rose);font-size:1.5rem;margin-bottom:-10px}
@media (prefers-reduced-motion:reduce){.cloud,.fl{animation:none}}
</style>
</head>

$('photoIn').onchange=function(e){var f=e.target.files[0];if(!f)return;
  var img=new Image();img.alt='Us';img.src=URL.createObjectURL(f);
  $('photoBtn').innerHTML='';$('photoBtn').appendChild(img)};
$('pick').onclick=function(){$('songIn').click()};
$('songIn').onchange=function(e){var f=e.target.files[0];if(!f)return;
  song.src=URL.createObjectURL(f);song.play();playBtn.textContent='Pause'};
function showPick(){$('pick').hidden=false}
song.onerror=showPick;
playBtn.onclick=function(){
  if(!song.src){$('songIn').click();return}
  if(song.paused){var pr=song.play();
    if(pr&&pr.then){pr.then(function(){playBtn.textContent='Pause'}).catch(showPick)}else{playBtn.textContent='Pause'}}
  else{song.pause();playBtn.textContent='Play our song'}};

if(!matchMedia('(prefers-reduced-motion: reduce)').matches){var D=$('deco');for(var h=0;h<9;h++){var s=document.createElement('span');s.className='fl';s.textContent='♥';s.style.left=(Math.random()*96)+'%';s.style.fontSize=(10+Math.random()*14)+'px';s.style.animationDuration=(14+Math.random()*14)+'s';s.style.animationDelay=(-Math.random()*20)+'s';D.appendChild(s)}}
var P=[
"I’m not always good with words, but you deserve to hear this properly.",
"Somewhere along the way, you became my favorite part of every day. Not because of anything big, but because of the small things: the way you laugh at your own jokes, the way you listen like nothing else matters, the way you make a quiet evening feel like the best plan in the world.",
"I think about you more than I admit. In the middle of an ordinary afternoon, a small thought of you shows up, and suddenly I’m smiling at nothing.",
"With you, I don’t have to pretend. I can be tired, silly, or completely out of words, and you still make me feel like I’m enough. That is a rare kind of peace, and I never take it for granted.",
"I love how you care without making a show of it. The little check-ins, the patience, the way you remember what I said days ago. Those are the things that made me trust you, and they are the things I fall for again and again.",
"Thank you for your patience on my difficult days, for your kindness when I didn’t ask for it, and for staying when leaving would have been easier.",
"If I could go back to the moment we met, I wouldn’t change anything. Every wrong turn, every long wait, every late night led me here, to you, and here is exactly where I want to be.",
"I don’t need grand gestures or perfect days. I only need you: your voice, your hand in mine, and the quiet feeling that everything is going to be okay.",
"I can’t promise a perfect life, but I can promise this: I’ll keep choosing you, today, tomorrow, and every day after.",
"From Kamila, with all my love."
];
var L=$('letter'),pi=0,pj=0,tn=null,skip=false;
var caret=document.createElement('span');caret.className='caret';
function follow(){if(innerHeight+scrollY>document.body.scrollHeight-180)scrollTo(0,document.body.scrollHeight)}
function step(){
  if(skip)return;
  if(pi>=P.length){caret.remove();return}
  if(pj===0){var el=document.createElement('p');if(pi===P.length-1)el.className='sign';
    tn=document.createTextNode('');el.appendChild(tn);el.appendChild(caret);L.appendChild(el)}
  var t=P[pi];
  if(pj<t.length){var c=t.charAt(pj++);tn.nodeValue+=c;follow();setTimeout(step,/[.,:;!?]/.test(c)?420:68)}
  else{pi++;pj=0;setTimeout(step,1400)}
}
function finish(){skip=true;L.innerHTML='';P.forEach(function(t,k){var p=document.createElement('p');if(k===P.length-1)p.className='sign';p.textContent=t;L.appendChild(p)})}
L.onclick=finish;
if(matchMedia('(prefers-reduced-motion: reduce)').matches)finish();else setTimeout(step,1800);
</script>
